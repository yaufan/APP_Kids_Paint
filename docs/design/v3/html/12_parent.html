<div style="margin:0 16px 14px;border-radius:22px;background:#fff;padding:14px 16px;box-shadow:0 2px 0 #ECE7DD"><div style="font-size:14px;color:#6B7A70;margin-bottom:6px">其他</div><div class="center" style="justify-content:space-between;height:50px"><span class="center" style="gap:10px;font-size:17px;color:#34413A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg><span>開放原始碼授權</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9B2A4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></div><div class="center" style="justify-content:space-between;height:50px"><span class="center" style="gap:10px;font-size:17px;color:#D9423F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D9423F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg><span>刪除所有資料</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9B2A4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></div></div>
