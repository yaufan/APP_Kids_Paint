name: iOS Simulator

# By hand only: Actions -> iOS Simulator -> Run workflow. A Mac minute counts
# as ten of the private repository's free minutes, and one run (iPhone and
# iPad, about 32 minutes) uses some 320 of the 2,000 a month
# (docs/deployment.md, "GitHub Actions 的免費額度").
on:
  workflow_dispatch:

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  simulators:
    runs-on: macos-latest
    timeout-minutes: 200
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get

      - name: Pick an iPhone and an iPad simulator
        id: sims
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, re, subprocess
          data = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          def version(runtime):
              return [int(n) for n in re.findall(r'\d+', runtime.split('iOS')[-1])]
          ios = sorted((r for r in data['devices'] if 'iOS' in r), key=version, reverse=True)
          devices = [d for r in ios for d in data['devices'][r]]
          iphone = next(d for d in devices if d['name'].startswith('iPhone'))
          ipad = next(d for d in devices if d['name'].startswith('iPad'))
          print(f"iphone={iphone['udid']}")
          print(f"iphone_name={iphone['name']}")
          print(f"ipad={ipad['udid']}")
          print(f"ipad_name={ipad['name']}")
          EOF

      # Each step builds the app (about 6 minutes) and walks through it
      # (about 8 more); a launch that hangs is tried once more (see the script).
      - name: Walk-through on ${{ steps.sims.outputs.iphone_name }}
        timeout-minutes: 85
        env:
          SCREENSHOT_DIR: build/ios_screenshots/iphone
        run: ../.github/ios_walk_through.sh "${{ steps.sims.outputs.iphone }}"

      - name: Walk-through on ${{ steps.sims.outputs.ipad_name }}
        timeout-minutes: 85
        env:
          SCREENSHOT_DIR: build/ios_screenshots/ipad
        run: ../.github/ios_walk_through.sh "${{ steps.sims.outputs.ipad }}"

      # Kept 3 days: the private repository has 500 MB for all artifacts.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ios-simulator-screenshots
          path: app/build/ios_screenshots/
          retention-days: 3
