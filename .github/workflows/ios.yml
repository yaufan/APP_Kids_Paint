name: iOS Simulator

# macOS runners use the private repo's free minutes ten times faster, so this
# runs only on main, by hand, or for a push whose commit message has [ios].
on:
  push:
    paths: ['app/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  simulators:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[ios]')
    # On the job, not the workflow: a push without [ios] is skipped and must
    # not cancel a walk-through that is still running.
    concurrency:
      group: ios-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-latest
    timeout-minutes: 200
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get

      - name: Pick an iPhone and an iPad simulator
        id: sims
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, re, subprocess
          data = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          def version(runtime):
              return [int(n) for n in re.findall(r'\d+', runtime.split('iOS')[-1])]
          ios = sorted((r for r in data['devices'] if 'iOS' in r), key=version, reverse=True)
          devices = [d for r in ios for d in data['devices'][r]]
          iphone = next(d for d in devices if d['name'].startswith('iPhone'))
          ipad = next(d for d in devices if d['name'].startswith('iPad'))
          print(f"iphone={iphone['udid']}")
          print(f"iphone_name={iphone['name']}")
          print(f"ipad={ipad['udid']}")
          print(f"ipad_name={ipad['name']}")
          EOF

      # Each step builds the app (about 6 minutes) and walks through it
      # (about 8 more); a launch that hangs is tried once more (see the script).
      - name: Walk-through on ${{ steps.sims.outputs.iphone_name }}
        timeout-minutes: 85
        env:
          SCREENSHOT_DIR: build/ios_screenshots/iphone
        run: ../.github/ios_walk_through.sh "${{ steps.sims.outputs.iphone }}"

      - name: Walk-through on ${{ steps.sims.outputs.ipad_name }}
        timeout-minutes: 85
        env:
          SCREENSHOT_DIR: build/ios_screenshots/ipad
        run: ../.github/ios_walk_through.sh "${{ steps.sims.outputs.ipad }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: app/build/ios_screenshots/
          retention-days: 30
