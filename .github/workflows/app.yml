name: App

on:
  push:
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get

      - name: Generated database code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/

      - run: flutter analyze

      # Real fonts so the walk-through screenshots show Chinese text and emoji.
      - name: Install fonts for screenshots
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-wqy-zenhei fonts-noto-color-emoji

      # Includes test/flow_test.dart: a simulated child goes through the whole
      # app on a phone-sized screen and every step is captured.
      - run: flutter test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          path: app/build/screenshots/
          retention-days: 30

      # Signed with the debug key (see android/app/build.gradle.kts): fine for
      # installing on a test phone, not for Google Play.
      - name: Build Android APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kids-paint-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
