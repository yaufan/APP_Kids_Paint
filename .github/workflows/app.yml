name: App

on:
  push:
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

# One run per commit: main and the working branch are pushed with the same
# commit, and the private repository's free minutes should test it once
# (docs/deployment.md, "GitHub Actions 的免費額度").
concurrency:
  group: app-${{ github.sha }}
  cancel-in-progress: true

# The fingerprint of the test key the APKs are signed with (docs/deployment.md).
env:
  TEST_KEY_SHA256: 69a4e28c011a4dd37048f43a2d244173250d28c0ff0c723fffbbd229bc57235d

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get

      - name: Generated database code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/

      - run: flutter analyze

      # Real fonts so the walk-through screenshots show Chinese text and emoji.
      - name: Install fonts for screenshots
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-wqy-zenhei fonts-noto-color-emoji

      # Includes test/flow_test.dart: a simulated child goes through the whole
      # app on a phone-sized screen and every step is captured.
      - run: flutter test

      # Only when something failed: the private repository has 500 MB for
      # all artifacts together. A full store does not fail the build.
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: app-screenshots
          path: app/build/screenshots/
          retention-days: 3

      # Version from pubspec.yaml, build number from the commit count (only
      # ever grows, as the stores require). See docs/versioning.md.
      - name: Version
        run: |
          echo "VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # The NDK Flutter asks for is not on the runner. Downloading it took
      # minutes on every run and once came back broken, so it is cached.
      - name: NDK version
        run: |
          FLUTTER_ROOT=$(dirname "$(dirname "$(which flutter)")")
          NDK=$(sed -n 's/.*val ndkVersion: String = "\(.*\)"/\1/p' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")
          if [ -z "$NDK" ]; then echo "::warning::NDK version not found, not cached"; exit 0; fi
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "NDK_DIR=$ANDROID_HOME/ndk/$NDK" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        if: env.NDK != ''
        with:
          path: ${{ env.NDK_DIR }}
          key: android-ndk-${{ env.NDK }}

      # The test key every APK is signed with (docs/deployment.md), from the
      # repository's secrets: the same key every time, so phones can update.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signed with a throwaway key, phones cannot update to it"
            exit 0
          else
            # Spaces and line breaks from pasting the secret are dropped.
            printf '%s' "$KEYSTORE" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/kids-paint.p12"
            echo "KIDS_PAINT_KEYSTORE=$RUNNER_TEMP/kids-paint.p12" >> "$GITHUB_ENV"
          fi

      # Signed with the test key (or the debug key without it): fine for
      # installing on a test phone, not for Google Play.
      - name: Build Android APK
        env:
          KIDS_PAINT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --build-name="$VERSION" --build-number="$BUILD" \
            --dart-define=APP_VERSION="$VERSION" --dart-define=APP_BUILD="$BUILD"
          # One APK per kind of phone chip, about a third of one with all three.
          for abi in arm64-v8a:arm64 armeabi-v7a:armv7 x86_64:x86_64; do
            mv "build/app/outputs/flutter-apk/app-${abi%:*}-release.apk" "build/kids-paint-$VERSION-$BUILD-${abi#*:}.apk"
          done

      # Signed with the test key, or a phone with the app on it cannot update.
      - name: Check the signing key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/kids-paint-*.apk; do
            CERTS=$("$APKSIGNER" verify --print-certs "$apk")
            if ! grep -q "SHA-256 digest: $TEST_KEY_SHA256" <<< "$CERTS"; then
              echo "::warning::$apk is not signed with the test key"
              exit 0
            fi
          done

      # The privacy promise, checked on the real packages: no network, no
      # location, no advertising ID (docs/safety-privacy.md).
      - name: Check Android permissions
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in build/kids-paint-*.apk; do
            "$AAPT2" dump permissions "$apk" | tee -a permissions.txt
          done
          if grep -E 'INTERNET|LOCATION|AD_ID' permissions.txt; then
            echo "::error::The APK asks for a permission the app promises not to use"
            exit 1
          fi

      # The phone APK for testing between versions (all three are on each
      # release). Kept 3 days, for the same 500 MB.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: kids-paint-android-apk
          path: app/build/kids-paint-*-arm64.apk
          retention-days: 3
