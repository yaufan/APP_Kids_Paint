name: App

on:
  push:
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get

      - name: Generated database code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/

      - run: flutter analyze

      # Real fonts so the walk-through screenshots show Chinese text and emoji.
      - name: Install fonts for screenshots
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-wqy-zenhei fonts-noto-color-emoji

      # Includes test/flow_test.dart: a simulated child goes through the whole
      # app on a phone-sized screen and every step is captured.
      - run: flutter test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          path: app/build/screenshots/
          retention-days: 30

      # Version from pubspec.yaml, build number from the commit count (only
      # ever grows, as the stores require). See docs/versioning.md.
      - name: Version
        run: |
          echo "VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # Signed with the debug key (see android/app/build.gradle.kts): fine for
      # installing on a test phone, not for Google Play.
      - name: Build Android APK
        run: |
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD" \
            --dart-define=APP_VERSION="$VERSION" --dart-define=APP_BUILD="$BUILD"
          mv build/app/outputs/flutter-apk/app-release.apk "build/kids-paint-$VERSION-$BUILD.apk"

      # The privacy promise, checked on the real package: no network, no
      # location, no advertising ID (docs/safety-privacy.md).
      - name: Check Android permissions
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions "build/kids-paint-$VERSION-$BUILD.apk" | tee permissions.txt
          if grep -E 'INTERNET|LOCATION|AD_ID' permissions.txt; then
            echo "::error::The APK asks for a permission the app promises not to use"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kids-paint-android-apk
          path: app/build/kids-paint-*.apk
          retention-days: 30
