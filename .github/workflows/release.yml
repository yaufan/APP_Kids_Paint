name: Release

# Publishes the version in app/pubspec.yaml: tag v<version>, a GitHub Release
# with the APK and the CHANGELOG.md notes. Releases not made from main are
# marked pre-release. See docs/versioning.md.
on:
  # Automatic: a push that changes the version releases it once the tests
  # pass. A version that is already released is skipped.
  push:
    paths:
      - app/pubspec.yaml
      - CHANGELOG.md
      - .github/workflows/release.yml
  # By hand: Actions -> Release -> Run workflow. GitHub shows the button only
  # once this file is on the default branch.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::error::v$VERSION is already released. Raise the version in app/pubspec.yaml and add it to CHANGELOG.md."
              exit 1
            fi
            echo "::notice::v$VERSION is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Build number and release notes
        run: |
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          # This version's section of the changelog becomes the release notes.
          awk -v v="$VERSION" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' ../CHANGELOG.md > ../release-notes.md
          if [ ! -s ../release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Includes test/version_test.dart: pubspec, CHANGELOG and the version
      # shown in the app must agree.
      - run: flutter test

      # The NDK Flutter asks for is not on the runner. Downloading it took
      # minutes on every run and once came back broken, so it is cached.
      - name: NDK version
        run: |
          FLUTTER_ROOT=$(dirname "$(dirname "$(which flutter)")")
          NDK=$(sed -n 's/.*val ndkVersion: String = "\(.*\)"/\1/p' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")
          if [ -z "$NDK" ]; then echo "::warning::NDK version not found, not cached"; exit 0; fi
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "NDK_DIR=$ANDROID_HOME/ndk/$NDK" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        if: env.NDK != ''
        with:
          path: ${{ env.NDK_DIR }}
          key: android-ndk-${{ env.NDK }}

      - name: Build Android APK
        run: |
          flutter build apk --release --split-per-abi --build-name="$VERSION" --build-number="$BUILD" \
            --dart-define=APP_VERSION="$VERSION" --dart-define=APP_BUILD="$BUILD"
          # One APK per kind of phone chip, about a third of one with all three.
          for abi in arm64-v8a:arm64 armeabi-v7a:armv7 x86_64:x86_64; do
            mv "build/app/outputs/flutter-apk/app-${abi%:*}-release.apk" "build/kids-paint-$VERSION-${abi#*:}.apk"
          done

      # Same check as the App workflow: no network, location or advertising ID.
      - name: Check Android permissions
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in build/kids-paint-*.apk; do
            "$AAPT2" dump permissions "$apk" | tee -a permissions.txt
          done
          if grep -E 'INTERNET|LOCATION|AD_ID' permissions.txt; then
            echo "::error::The APK asks for a permission the app promises not to use"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          if [ "$GITHUB_REF_NAME" != "main" ]; then PRE="--prerelease"; fi
          # Which APK to pick goes above this version's notes.
          {
            echo "**下載哪一個？**"
            echo "- 一般手機（大多數 2017 年以後的手機）：\`kids-paint-$VERSION-arm64.apk\`"
            echo "- 很舊的手機（上面那個裝不起來的話）：\`kids-paint-$VERSION-armv7.apk\`"
            echo "- 電腦上的 Android 模擬器、Intel 的 Chromebook：\`kids-paint-$VERSION-x86_64.apk\`"
            echo
            cat ../release-notes.md
          } > ../notes.md
          gh release create "v$VERSION" build/kids-paint-"$VERSION"-*.apk \
            --target "$GITHUB_SHA" --title "畫畫小鎮 $VERSION" --notes-file ../notes.md $PRE
