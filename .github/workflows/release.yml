name: Release

# Press "Run workflow" (Actions -> Release) to publish the version in
# app/pubspec.yaml: tag v<version>, a GitHub Release with the APK and the
# CHANGELOG.md notes. Releases not made from main are marked pre-release.
# See docs/versioning.md.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released. Raise the version in app/pubspec.yaml and add it to CHANGELOG.md."
            exit 1
          fi
          # This version's section of the changelog becomes the release notes.
          awk -v v="$VERSION" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' ../CHANGELOG.md > ../release-notes.md
          if [ ! -s ../release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - name: Build Android APK
        run: |
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD" \
            --dart-define=APP_VERSION="$VERSION" --dart-define=APP_BUILD="$BUILD"
          mv build/app/outputs/flutter-apk/app-release.apk "build/kids-paint-$VERSION.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          if [ "$GITHUB_REF_NAME" != "main" ]; then PRE="--prerelease"; fi
          gh release create "v$VERSION" "build/kids-paint-$VERSION.apk" \
            --target "$GITHUB_SHA" --title "畫畫小鎮 $VERSION" --notes-file ../release-notes.md $PRE
